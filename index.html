<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="quiz-container">
    <!-- Start Screen -->
    <section id="start-screen" class="screen active">
      <h1>General Knowledge Quiz</h1>
      <p>Test your knowledge! You have 15 seconds per question.</p>
      <p class="question-count-badge">Total Questions Ready: <strong id="total-available">0</strong></p>
      
      <div class="action-group">
        <button id="start-btn" class="btn primary-btn">Start Quiz</button>
        <button id="open-builder-btn" class="btn secondary-btn">+ Add Custom Questions</button>
      </div>
    </section>

    <!-- Custom Question Builder Screen -->
    <section id="builder-screen" class="screen">
      <header class="builder-header">
        <h2>Add Custom Question</h2>
        <button id="back-home-btn" class="btn text-btn">← Back</button>
      </header>

      <form id="custom-question-form" class="builder-form">
        <div class="form-group">
          <label for="new-question">Question</label>
          <input type="text" id="new-question" placeholder="Enter your question..." required />
        </div>

        <div class="form-group">
          <label>Options (Select the radio button for the correct answer)</label>
          <div class="option-input-row">
            <input type="radio" name="correct-option" value="0" required checked />
            <input type="text" class="option-input" placeholder="Option 1" required />
          </div>
          <div class="option-input-row">
            <input type="radio" name="correct-option" value="1" required />
            <input type="text" class="option-input" placeholder="Option 2" required />
          </div>
          <div class="option-input-row">
            <input type="radio" name="correct-option" value="2" required />
            <input type="text" class="option-input" placeholder="Option 3" required />
          </div>
          <div class="option-input-row">
            <input type="radio" name="correct-option" value="3" required />
            <input type="text" class="option-input" placeholder="Option 4" required />
          </div>
        </div>

        <button type="submit" class="btn primary-btn">Save Question</button>
      </form>

      <div class="custom-list-section">
        <div class="custom-list-header">
          <h3>Your Custom Questions (<span id="custom-count">0</span>)</h3>
          <button id="clear-custom-btn" class="btn danger-text-btn" type="button">Clear All</button>
        </div>
        <ul id="custom-questions-list" class="custom-list"></ul>
      </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="screen">
      <header class="quiz-header">
        <span id="question-counter">Question 1 of 5</span>
        <div class="timer-badge">Time: <span id="time-left">15</span>s</div>
      </header>

      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>

      <h2 id="question-text">Question goes here</h2>
      <div id="options-container" class="options-grid"></div>

      <footer class="quiz-footer">
        <button id="next-btn" class="btn primary-btn" disabled>Next Question</button>
      </footer>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="screen">
      <h1>Quiz Completed!</h1>
      <p class="score-display">Your Score: <strong id="final-score">0</strong> / <span id="total-questions">5</span></p>
      <p id="feedback-message" class="feedback-text"></p>
      <div class="action-group">
        <button id="restart-btn" class="btn primary-btn">Play Again</button>
        <button id="home-btn" class="btn secondary-btn">Main Menu</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
